name: Deploy TramaSul Têxtil

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar aplicação na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Textil_Vestuario
            git pull origin main
            sudo docker build -t tramasul-textil .
            sudo docker rm -f tramasul-web || true
            sudo docker run -d --restart unless-stopped --name tramasul-web -p 80:80 tramasul-textil
            sudo docker ps
